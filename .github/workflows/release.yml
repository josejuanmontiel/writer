  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AntigravityWriter-x86_64.AppImage
            artifacts/antigravity-writer-windows-offline.zip
            artifacts/antigravity-writer-macos-offline.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

