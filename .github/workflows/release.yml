name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# AÑADIDO: Permisos necesarios para crear la release y subir assets
permissions:
  contents: write

jobs:
  prepare-msvc-dlls:
    name: Prepare Windows MSVC DLLs
    runs-on: windows-latest
    steps:
      - name: Copy DLLs
        run: |
          mkdir msvc_dlls
          copy C:\Windows\System32\vcruntime140.dll msvc_dlls\
          copy C:\Windows\System32\vcruntime140_1.dll msvc_dlls\
          copy C:\Windows\System32\msvcp140.dll msvc_dlls\
      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: msvc_dlls
          path: msvc_dlls/

  build:
    name: Build and Test
    needs: prepare-msvc-dlls
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: AntigravityWriter-x86_64.AppImage
          - os: ubuntu-latest
            platform: windows
            artifact: antigravity-writer-windows-offline.zip
          - os: macos-latest
            platform: macos
            artifact: antigravity-writer-macos-offline.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cleanup LFS Pointers
        run: |
          # Borramos archivos que puedan ser punteros de LFS y causar conflictos
          # Esto debe hacerse ANTES de bajar los archivos reales o restaurar la caché
          rm -f lib/windows/libdl.a
          rm -f lib/windows/libtokenizers.a
          rm -f lib/windows/onnxruntime.lib
          rm -f lib/tokenizers/libtokenizers.a

      - name: Cache Assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            models/
            lib/windows/
            lib/tokenizers/
            lib/onnxruntime/
          key: ${{ matrix.platform }}-assets-v5-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Download Assets from Hugging Face
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: |
          # Usamos wget para bajar los modelos y librerías
          # Bajamos los modelos
          mkdir -p models/gliner2_native
          wget -q --tries=5 --waitretry=2 -O models/ggml-tiny.bin https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/ggml-tiny.bin
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/count_embed.onnx https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/count_embed.onnx
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/count_embed.onnx.data https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/count_embed.onnx.data
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/encoder.onnx https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/encoder.onnx
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/encoder.onnx.data https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/encoder.onnx.data
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/gliner_classifiers.safetensors https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/gliner_classifiers.safetensors
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/prompt_ids.json https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/prompt_ids.json
          wget -q --tries=5 --waitretry=2 -O models/gliner2_native/tokenizer.json https://huggingface.co/josejuanmontiel/writer-models/resolve/main/models/gliner2_native/tokenizer.json
          
          # Bajamos las librerías necesarias para compilar/enlace
          mkdir -p lib/windows lib/onnxruntime/lib
          wget -q --tries=5 --waitretry=2 -O lib/onnxruntime/lib/libonnxruntime.so.1.22.0 https://huggingface.co/josejuanmontiel/writer-models/resolve/main/lib/onnxruntime/lib/libonnxruntime.so.1.22.0
          
          # Bajamos onnxruntime.dll (única DLL externa necesaria ahora)
          wget -q --tries=5 --waitretry=2 -O lib/windows/onnxruntime.dll https://huggingface.co/josejuanmontiel/writer-models/resolve/main/lib/windows/onnxruntime.dll
          
          # Las DLLs de MSVC se descargarán después a través del artefacto de Github Actions
          
          # Descarga de libtokenizers para Linux (necesaria para el enlazado)
          if [ "${{ matrix.platform }}" == "linux" ]; then
            mkdir -p lib/tokenizers
            wget -q --tries=5 --waitretry=2 -O libtokenizers.tar.gz https://github.com/daulet/tokenizers/releases/download/v1.26.0/libtokenizers.linux-amd64.tar.gz
            tar -xzf libtokenizers.tar.gz -C lib/tokenizers
            rm libtokenizers.tar.gz
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            mkdir -p lib/tokenizers
            wget -q --tries=5 --waitretry=2 -O libtokenizers.tar.gz https://github.com/daulet/tokenizers/releases/download/v1.26.0/libtokenizers.darwin-arm64.tar.gz
            tar -xzf libtokenizers.tar.gz -C lib/tokenizers
            rm libtokenizers.tar.gz
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            # Windows usa la librería estática que subimos a HF (compilada manualmente)
            mkdir -p lib/windows
            wget -q --tries=5 --waitretry=2 -O lib/windows/libtokenizers.a https://huggingface.co/josejuanmontiel/writer-models/resolve/main/lib/windows/libtokenizers.a
          fi

      - name: Download MSVC DLLs
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: msvc_dlls
          path: lib/windows/

      - name: Verificamos qué se ha bajado y dónde (para todas las plataformas)
        run: |
          echo "--- DEBUG: Verificando archivos descargados ---"
          ls -R lib/ || true
          ls -R models/ || true
          echo "----------------------------------------------"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Ajustado a la versión actual estable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add GOBIN to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev cmake

      - name: Install Windows Dependencies
        if: matrix.platform == 'windows'
        run: sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64 binutils-mingw-w64

      - name: Build whisper.cpp (Unix)
        if: matrix.platform == 'macos' || matrix.platform == 'linux'
        run: |
          cd lib/whisper.cpp
          if [ "${{ matrix.platform }}" == "macos" ]; then
            cmake -B build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          else
            cmake -B build -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          fi
          cmake --build build --config Release
          
          # Consolidamos todas las librerías estáticas en build/src
          # 1. Aseguramos el prefijo 'lib'
          # 2. Las movemos todas a build/src para que el linker las encuentre fácil
          find build -name "*.a" -exec bash -c 'dir=$(dirname "{}"); base=$(basename "{}"); if [[ ! $base =~ ^lib ]]; then mv "{}" "$dir/lib$base"; fi' \;
          find build -name "lib*.a" -exec cp "{}" build/src/ \;
          
          echo "--- Librerías recolectadas en build/src ---"
          ls build/src/*.a

      - name: Build whisper.cpp (Windows Cross-Compile)
        if: matrix.platform == 'windows'
        run: |
          cd lib/whisper.cpp
          # Usamos un toolchain file o variables manuales para MinGW
          # Definimos _WIN32_WINNT=0x0601 para evitar errores con THREAD_POWER_THROTTLING_STATE
          cmake -B build-win -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0601" \
            -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0601" \
            -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build-win --config Release
          
          # Renombramos las librerías para que el linker las encuentre con el prefijo 'lib'
          find build-win -name "*.a" -exec bash -c 'dir=$(dirname "{}"); base=$(basename "{}"); if [[ ! $base =~ ^lib ]]; then mv "{}" "$dir/lib$base"; fi' \;
          
          # Copiamos las librerías estáticas generadas a lib/windows para que CGO las enlace
          find build-win -name "lib*.a" -exec cp "{}" ../windows/ \;
          echo "--- Librerías estáticas compiladas para Windows ---"
          ls ../windows/*.a

      - name: Test CGO Compilation
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export CGO_ENABLED=1
          export CGO_CFLAGS_ALLOW=".*"
          export CGO_LDFLAGS_ALLOW=".*"
          export CGO_CFLAGS="-I${{ github.workspace }}/lib/whisper.cpp/include -I${{ github.workspace }}/lib/whisper.cpp/ggml/include"
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/lib/whisper.cpp/build/src:${{ github.workspace }}/lib/whisper.cpp/build/ggml/src:${{ github.workspace }}/lib/onnxruntime/lib
          export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:${{ github.workspace }}/lib/whisper.cpp/build/src:${{ github.workspace }}/lib/whisper.cpp/build/ggml/src
          
          if [ "${{ matrix.platform }}" == "windows" ]; then
            export GOOS=windows
            export GOARCH=amd64
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export CGO_LDFLAGS="-L${{ github.workspace }}/lib/windows -static-libstdc++ -static-libgcc -fopenmp -Wl,-Bstatic -lgomp -Wl,-Bdynamic -lpthread -lntdll -lbcrypt"
          else
            export CGO_LDFLAGS="-L${{ github.workspace }}/lib/whisper.cpp/build/src -L${{ github.workspace }}/lib/whisper.cpp/build/ggml/src -L${{ github.workspace }}/lib/tokenizers -L${{ github.workspace }}/lib/onnxruntime/lib"
          fi
          
          echo "Compiling cmd/test-cgo..."
          if [ "${{ matrix.platform }}" == "windows" ]; then
            go build -x -ldflags "-linkmode external -extldflags '-lntdll -lbcrypt -luserenv -lws2_32'" -o test-cgo-app.exe ./cmd/test-cgo
          else
            go build -x -o test-cgo-app ./cmd/test-cgo
          fi
          echo "✅ CGO Compilation test passed for ${{ matrix.platform }}"

      - name: Build and Package
        run: |
          # Aseguramos que wails esté en el path
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Definimos variables base comunes
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I${{ github.workspace }}/lib/whisper.cpp/include -I${{ github.workspace }}/lib/whisper.cpp/ggml/include"
          
          # Añadimos las librerías al PATH de ejecución para que Wails pueda generar bindings
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/lib/whisper.cpp/build/src:${{ github.workspace }}/lib/whisper.cpp/build/ggml/src:${{ github.workspace }}/lib/onnxruntime/lib
          export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:${{ github.workspace }}/lib/whisper.cpp/build/src:${{ github.workspace }}/lib/whisper.cpp/build/ggml/src
          
          if [ "${{ matrix.platform }}" == "linux" ]; then
            make package-linux-docker
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            make package-windows
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            make package-macos
          fi

      - name: Validate Linux Build (MCP Integration Test)
        if: matrix.platform == 'linux'
        run: |
          echo "🧪 Testing compiled Linux binary in MCP-only headless mode inside Docker..."
          docker run -d --name mcp-test-container -p 3000:3000 --entrypoint bash -v ${{ github.workspace }}:/app -e LD_LIBRARY_PATH=/app/lib/onnxruntime/lib antigravity-builder -c "./build/bin/writer --mcp-only"
          sleep 5
          if curl -s -I http://localhost:3000/mcp | grep -q "HTTP/1.1"; then
            echo "✅ Linux MCP integration test passed!"
            docker kill mcp-test-container
            docker rm mcp-test-container
          else
            echo "❌ Linux MCP integration test failed. Application output:"
            docker logs mcp-test-container
            docker kill mcp-test-container
            docker rm mcp-test-container
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: ${{ matrix.artifact }}

